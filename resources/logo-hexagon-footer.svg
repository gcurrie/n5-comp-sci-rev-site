<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="hexFooterTitle">
  <title id="hexFooterTitle">Computing Revision Hub — Higher</title>

  <!-- Detailed badge for footer / large display. Transparent background:
       designed to sit on the dark green footer bar.
       textLength is set on each label so the layout stays identical even
       when JetBrains Mono is unavailable and a fallback mono is used. -->

  <!-- processor pins across the top half -->
  <g stroke="#92750A" stroke-width="2" stroke-linecap="round">
    <line x1="72.6" y1="128.2" x2="62.3" y2="124.4"/>
    <line x1="82.9" y1="108.0" x2="73.8" y2="101.8"/>
    <line x1="97.8" y1="90.9"  x2="90.4" y2="82.7"/>
    <line x1="116.3" y1="77.9" x2="111.2" y2="68.2"/>
    <line x1="137.5" y1="69.8" x2="134.8" y2="59.1"/>
    <line x1="160.0" y1="67.0" x2="160.0" y2="56.0"/>
    <line x1="182.5" y1="69.8" x2="185.2" y2="59.1"/>
    <line x1="203.7" y1="77.9" x2="208.8" y2="68.2"/>
    <line x1="222.2" y1="90.9" x2="229.6" y2="82.7"/>
    <line x1="237.1" y1="108.0" x2="246.2" y2="101.8"/>
    <line x1="247.4" y1="128.2" x2="257.7" y2="124.4"/>
  </g>
  <g fill="#C9A227">
    <circle cx="59.0"  cy="123.2" r="2.6"/>
    <circle cx="70.9"  cy="99.9"  r="2.6"/>
    <circle cx="88.1"  cy="80.1"  r="2.6"/>
    <circle cx="109.5" cy="65.1"  r="2.6"/>
    <circle cx="134.0" cy="55.7"  r="2.6"/>
    <circle cx="160.0" cy="52.5"  r="2.6"/>
    <circle cx="186.0" cy="55.7"  r="2.6"/>
    <circle cx="210.5" cy="65.1"  r="2.6"/>
    <circle cx="231.9" cy="80.1"  r="2.6"/>
    <circle cx="249.1" cy="99.9"  r="2.6"/>
    <circle cx="261.0" cy="123.2" r="2.6"/>
  </g>

  <!-- hexagon body -->
  <polygon points="248,160 204,236.2 116,236.2 72,160 116,83.8 204,83.8"
           fill="#001810" stroke="#C9A227" stroke-width="4"/>
  <polygon points="238,160 199,227.5 121,227.5 82,160 121,92.5 199,92.5"
           fill="none" stroke="#1B6B45" stroke-width="1.5"/>

  <g font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace" text-anchor="middle">
    <!-- code bracket -->
    <text x="160" y="138" font-size="17" font-weight="700" fill="#C9A227"
          textLength="30" lengthAdjust="spacingAndGlyphs">&lt;/&gt;</text>

    <!-- monogram -->
    <text x="160" y="182" font-size="46" font-weight="700" fill="#F8F7F2"
          textLength="83" lengthAdjust="spacingAndGlyphs">CRH</text>

    <!-- wordmark -->
    <g font-size="9.5" font-weight="700" fill="#C7DED2" letter-spacing="1">
      <text x="160" y="202" textLength="56" lengthAdjust="spacingAndGlyphs">COMPUTING</text>
      <text x="160" y="213" textLength="50" lengthAdjust="spacingAndGlyphs">REVISION</text>
      <text x="160" y="224" textLength="20" lengthAdjust="spacingAndGlyphs">HUB</text>
    </g>
  </g>

  <!-- level, curved along the bottom -->
  <defs>
    <path id="hexArc" d="M63,216 A112,112 0 0,0 257,216" fill="none"/>
  </defs>
  <text font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace"
        font-size="16" font-weight="700" letter-spacing="5" fill="#C9A227">
    <textPath href="#hexArc" startOffset="50%" text-anchor="middle">HIGHER</textPath>
  </text>
</svg>
