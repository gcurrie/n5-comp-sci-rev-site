<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 1252" font-family="'Public Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-labelledby="voTitle voDesc">
  <title id="voTitle">Vector Objects and Their Attributes</title>
  <desc id="voDesc">The LottoScot logo shown as a vector graphic. At the top the assembled logo is drawn: a grey horizontal rectangle bar, a white ellipse outlined in black, the wordmark LottoScot, and a gold horizontal line beneath. Below, the logo is broken into three objects, each with its own attribute list. The rectangle has attributes x 30, y 60, width 320, height 30, fill colour grey, line colour black and line thickness 1. The ellipse has attributes centre x 190, centre y 75, width 210, height 104, fill colour white, line colour black and line thickness 2. The line has attributes start x 60, start y 138, end x 320, end y 138, line colour gold and line thickness 3. A note explains the wordmark is a fourth object, a text object, with attributes of its own. The lower half shows the layers panel and what moving an object forward does. Diagram 1 shows the rectangle behind the ellipse, so the white ellipse hides the middle of the grey bar; its layer list from front to back reads text, ellipse, rectangle, line, with the rectangle at position 3. Diagram 2 shows the rectangle brought forward so the bar now crosses over the ellipse; its layer list reads text, rectangle, ellipse, line, with the rectangle at position 2. The rectangle row is highlighted in both lists to show it has moved up one layer. The caption explains that only the layer order changed, no pixels were repainted, which is why this edit is easy in a vector application and hard in a bit-mapped one.</desc>

  <defs>
    <marker id="voArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#00442A"/>
    </marker>
    <marker id="voArrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#92750A"/>
    </marker>
  </defs>

  <!-- panel -->
  <rect x="1" y="1" width="1138" height="1250" fill="#F8F7F2" stroke="#D1D5DB" stroke-width="2"/>

  <!-- heading -->
  <text x="570" y="54" text-anchor="middle" font-size="30" font-weight="800" fill="#00442A" letter-spacing="-0.5">Vector Objects and Their Attributes</text>
  <text x="570" y="84" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="2.4" fill="#1B6B45"
        font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace">NOT A GRID OF PIXELS &#183; A LIST OF OBJECTS, EACH WITH ATTRIBUTES</text>

  <!-- ================= the assembled logo ================= -->
  <text x="570" y="118" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="1.8" fill="#4A5568"
        font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace">THE FINISHED LOGO</text>
  <rect x="380" y="128" width="380" height="170" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
  <g transform="translate(380,138)">
    <line x1="60" y1="138" x2="320" y2="138" stroke="#C9A227" stroke-width="3"/>
    <rect x="30" y="60" width="320" height="30" fill="#A9AFB6" stroke="#1A1A1A" stroke-width="1"/>
    <ellipse cx="190" cy="75" rx="105" ry="52" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
    <text x="190" y="84" text-anchor="middle" font-size="25" font-style="italic" font-family="Georgia,'Times New Roman',serif" fill="#1A1A1A">LottoScot</text>
  </g>

  <line x1="570" y1="302" x2="570" y2="336" stroke="#00442A" stroke-width="2" marker-end="url(#voArrow)"/>
  <text x="570" y="360" text-anchor="middle" font-size="14" fill="#1A1A1A">stored as a <tspan font-weight="700">list of objects</tspan>, each described by a set of <tspan font-weight="700">attributes</tspan></text>

  <!-- ================= object 1: rectangle ================= -->
  <rect x="140" y="380" width="270" height="110" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
  <rect x="175" y="418" width="200" height="34" fill="#A9AFB6" stroke="#1A1A1A" stroke-width="1"/>
  <rect x="140" y="490" width="270" height="28" fill="#00442A"/>
  <text x="156" y="509" font-size="10.5" font-weight="700" letter-spacing="1.8" fill="#FFFFFF"
        font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace">OBJECT 1 &#183; RECTANGLE</text>
  <rect x="140" y="518" width="270" height="190" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
  <g font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="11.5">
    <text x="156" y="542" fill="#4A5568">x</text>                <text x="394" y="542" text-anchor="end" fill="#1A1A1A" font-weight="700">30</text>
    <text x="156" y="567" fill="#4A5568">y</text>                <text x="394" y="567" text-anchor="end" fill="#1A1A1A" font-weight="700">60</text>
    <text x="156" y="592" fill="#4A5568">width</text>            <text x="394" y="592" text-anchor="end" fill="#1A1A1A" font-weight="700">320</text>
    <text x="156" y="617" fill="#4A5568">height</text>           <text x="394" y="617" text-anchor="end" fill="#1A1A1A" font-weight="700">30</text>
    <text x="156" y="642" fill="#4A5568">fill colour</text>      <text x="394" y="642" text-anchor="end" fill="#1A1A1A" font-weight="700">grey</text>
    <text x="156" y="667" fill="#4A5568">line colour</text>      <text x="394" y="667" text-anchor="end" fill="#1A1A1A" font-weight="700">black</text>
    <text x="156" y="692" fill="#4A5568">line thickness</text>   <text x="394" y="692" text-anchor="end" fill="#1A1A1A" font-weight="700">1</text>
  </g>
  <g stroke="#EEF1F0" stroke-width="1">
    <line x1="140" y1="550" x2="410" y2="550"/><line x1="140" y1="575" x2="410" y2="575"/>
    <line x1="140" y1="600" x2="410" y2="600"/><line x1="140" y1="625" x2="410" y2="625"/>
    <line x1="140" y1="650" x2="410" y2="650"/><line x1="140" y1="675" x2="410" y2="675"/>
  </g>

  <!-- ================= object 2: ellipse ================= -->
  <rect x="435" y="380" width="270" height="110" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
  <ellipse cx="570" cy="435" rx="95" ry="42" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="435" y="490" width="270" height="28" fill="#1B6B45"/>
  <text x="451" y="509" font-size="10.5" font-weight="700" letter-spacing="1.8" fill="#FFFFFF"
        font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace">OBJECT 2 &#183; ELLIPSE</text>
  <rect x="435" y="518" width="270" height="190" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
  <g font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="11.5">
    <text x="451" y="542" fill="#4A5568">centre x</text>         <text x="689" y="542" text-anchor="end" fill="#1A1A1A" font-weight="700">190</text>
    <text x="451" y="567" fill="#4A5568">centre y</text>         <text x="689" y="567" text-anchor="end" fill="#1A1A1A" font-weight="700">75</text>
    <text x="451" y="592" fill="#4A5568">width</text>            <text x="689" y="592" text-anchor="end" fill="#1A1A1A" font-weight="700">210</text>
    <text x="451" y="617" fill="#4A5568">height</text>           <text x="689" y="617" text-anchor="end" fill="#1A1A1A" font-weight="700">104</text>
    <text x="451" y="642" fill="#4A5568">fill colour</text>      <text x="689" y="642" text-anchor="end" fill="#1A1A1A" font-weight="700">white</text>
    <text x="451" y="667" fill="#4A5568">line colour</text>      <text x="689" y="667" text-anchor="end" fill="#1A1A1A" font-weight="700">black</text>
    <text x="451" y="692" fill="#4A5568">line thickness</text>   <text x="689" y="692" text-anchor="end" fill="#1A1A1A" font-weight="700">2</text>
  </g>
  <g stroke="#EEF1F0" stroke-width="1">
    <line x1="435" y1="550" x2="705" y2="550"/><line x1="435" y1="575" x2="705" y2="575"/>
    <line x1="435" y1="600" x2="705" y2="600"/><line x1="435" y1="625" x2="705" y2="625"/>
    <line x1="435" y1="650" x2="705" y2="650"/><line x1="435" y1="675" x2="705" y2="675"/>
  </g>

  <!-- ================= object 3: line ================= -->
  <rect x="730" y="380" width="270" height="110" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
  <line x1="765" y1="435" x2="965" y2="435" stroke="#C9A227" stroke-width="3"/>
  <rect x="730" y="490" width="270" height="28" fill="#92750A"/>
  <text x="746" y="509" font-size="10.5" font-weight="700" letter-spacing="1.8" fill="#FFFFFF"
        font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace">OBJECT 3 &#183; LINE</text>
  <rect x="730" y="518" width="270" height="190" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
  <g font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="11.5">
    <text x="746" y="542" fill="#4A5568">start x</text>          <text x="984" y="542" text-anchor="end" fill="#1A1A1A" font-weight="700">60</text>
    <text x="746" y="567" fill="#4A5568">start y</text>          <text x="984" y="567" text-anchor="end" fill="#1A1A1A" font-weight="700">138</text>
    <text x="746" y="592" fill="#4A5568">end x</text>            <text x="984" y="592" text-anchor="end" fill="#1A1A1A" font-weight="700">320</text>
    <text x="746" y="617" fill="#4A5568">end y</text>            <text x="984" y="617" text-anchor="end" fill="#1A1A1A" font-weight="700">138</text>
    <text x="746" y="642" fill="#4A5568">line colour</text>      <text x="984" y="642" text-anchor="end" fill="#1A1A1A" font-weight="700">gold</text>
    <text x="746" y="667" fill="#4A5568">line thickness</text>   <text x="984" y="667" text-anchor="end" fill="#1A1A1A" font-weight="700">3</text>
    <text x="746" y="692" fill="#9CA3AF">&#8212; a line has no fill</text>
  </g>
  <g stroke="#EEF1F0" stroke-width="1">
    <line x1="730" y1="550" x2="1000" y2="550"/><line x1="730" y1="575" x2="1000" y2="575"/>
    <line x1="730" y1="600" x2="1000" y2="600"/><line x1="730" y1="625" x2="1000" y2="625"/>
    <line x1="730" y1="650" x2="1000" y2="650"/><line x1="730" y1="675" x2="1000" y2="675"/>
  </g>

  <text x="570" y="734" text-anchor="middle" font-size="12.5" font-style="italic" fill="#4A5568">The wordmark is a fourth object &#8212; a <tspan font-weight="700" font-style="normal">text object</tspan> &#8212; with attributes of its own: the text, font, size, colour and position.</text>

  <!-- ================= layers ================= -->
  <line x1="40" y1="760" x2="1100" y2="760" stroke="#C7DED2" stroke-width="2"/>
  <text x="570" y="790" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="1.8" fill="#4A5568"
        font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace">THE LAYERS PANEL &#8212; WHAT &#8220;MOVE FORWARD&#8221; ACTUALLY DOES</text>

  <!-- diagram 1: rectangle behind the ellipse -->
  <rect x="140" y="802" width="380" height="170" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
  <g transform="translate(140,812)">
    <line x1="60" y1="138" x2="320" y2="138" stroke="#C9A227" stroke-width="3"/>
    <rect x="30" y="60" width="320" height="30" fill="#A9AFB6" stroke="#1A1A1A" stroke-width="1"/>
    <ellipse cx="190" cy="75" rx="105" ry="52" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
    <text x="190" y="84" text-anchor="middle" font-size="25" font-style="italic" font-family="Georgia,'Times New Roman',serif" fill="#1A1A1A">LottoScot</text>
  </g>
  <text x="330" y="992" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A">Diagram 1 &#8212; rectangle <tspan fill="#4A5568" font-weight="400">behind</tspan> the ellipse</text>

  <!-- diagram 2: rectangle brought forward -->
  <rect x="620" y="802" width="380" height="170" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
  <g transform="translate(620,812)">
    <line x1="60" y1="138" x2="320" y2="138" stroke="#C9A227" stroke-width="3"/>
    <ellipse cx="190" cy="75" rx="105" ry="52" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
    <rect x="30" y="60" width="320" height="30" fill="#A9AFB6" stroke="#1A1A1A" stroke-width="1"/>
    <text x="190" y="84" text-anchor="middle" font-size="25" font-style="italic" font-family="Georgia,'Times New Roman',serif" fill="#1A1A1A">LottoScot</text>
  </g>
  <text x="810" y="992" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A">Diagram 2 &#8212; rectangle <tspan fill="#92750A">brought forward</tspan></text>

  <!-- the move -->
  <text x="570" y="866" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="1.4" fill="#92750A"
        font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace">MOVE</text>
  <text x="570" y="880" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="1.4" fill="#92750A"
        font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace">FORWARD</text>
  <line x1="530" y1="900" x2="610" y2="900" stroke="#92750A" stroke-width="2.5" marker-end="url(#voArrowGold)"/>

  <!-- layer list 1 -->
  <rect x="140" y="1006" width="380" height="26" fill="#001810"/>
  <text x="156" y="1024" font-size="9.5" font-weight="700" letter-spacing="1.8" fill="#C9A227"
        font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace">LAYERS &#183; FRONT TO BACK</text>
  <rect x="140" y="1032" width="380" height="104" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
  <rect x="140" y="1084" width="380" height="26" fill="#FEF3C7"/>
  <g stroke="#EEF1F0" stroke-width="1">
    <line x1="140" y1="1058" x2="520" y2="1058"/><line x1="140" y1="1084" x2="520" y2="1084"/><line x1="140" y1="1110" x2="520" y2="1110"/>
  </g>
  <g font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="11" fill="#4A5568">
    <text x="160" y="1050">1</text><text x="160" y="1076">2</text><text x="160" y="1102" fill="#92750A" font-weight="700">3</text><text x="160" y="1128">4</text>
  </g>
  <rect x="182" y="1039" width="14" height="14" fill="#1A1A1A"/>
  <rect x="182" y="1065" width="14" height="14" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="182" y="1091" width="14" height="14" fill="#A9AFB6" stroke="#1A1A1A" stroke-width="1"/>
  <rect x="182" y="1117" width="14" height="14" fill="#C9A227"/>
  <g font-size="13" fill="#1A1A1A">
    <text x="212" y="1050">Text &#8212; &#8220;LottoScot&#8221;</text>
    <text x="212" y="1076">Ellipse</text>
    <text x="212" y="1102" font-weight="700" fill="#92750A">Rectangle</text>
    <text x="212" y="1128">Line</text>
  </g>

  <!-- layer list 2 -->
  <rect x="620" y="1006" width="380" height="26" fill="#001810"/>
  <text x="636" y="1024" font-size="9.5" font-weight="700" letter-spacing="1.8" fill="#C9A227"
        font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace">LAYERS &#183; FRONT TO BACK</text>
  <rect x="620" y="1032" width="380" height="104" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
  <rect x="620" y="1058" width="380" height="26" fill="#FEF3C7"/>
  <g stroke="#EEF1F0" stroke-width="1">
    <line x1="620" y1="1058" x2="1000" y2="1058"/><line x1="620" y1="1084" x2="1000" y2="1084"/><line x1="620" y1="1110" x2="1000" y2="1110"/>
  </g>
  <g font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="11" fill="#4A5568">
    <text x="640" y="1050">1</text><text x="640" y="1076" fill="#92750A" font-weight="700">2</text><text x="640" y="1102">3</text><text x="640" y="1128">4</text>
  </g>
  <rect x="662" y="1039" width="14" height="14" fill="#1A1A1A"/>
  <rect x="662" y="1065" width="14" height="14" fill="#A9AFB6" stroke="#1A1A1A" stroke-width="1"/>
  <rect x="662" y="1091" width="14" height="14" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="662" y="1117" width="14" height="14" fill="#C9A227"/>
  <g font-size="13" fill="#1A1A1A">
    <text x="692" y="1050">Text &#8212; &#8220;LottoScot&#8221;</text>
    <text x="692" y="1076" font-weight="700" fill="#92750A">Rectangle</text>
    <text x="692" y="1102">Ellipse</text>
    <text x="692" y="1128">Line</text>
  </g>

  <!-- ================= caption ================= -->
  <rect x="40" y="1160" width="1060" height="62" fill="#FEF3C7" stroke="#C9A227" stroke-width="2"/>
  <text x="570" y="1184" text-anchor="middle" font-size="12.5" fill="#1A1A1A">Only the <tspan font-weight="700">layer order</tspan> changed &#8212; the rectangle moved from position 3 to position 2. Not one attribute was edited, and not one pixel was repainted.</text>
  <text x="570" y="1204" text-anchor="middle" font-size="12.5" fill="#1A1A1A">In a bit-mapped application the same logo is only a grid of pixels, so there are no separate objects to reorder &#8212; you would have to redraw it by hand.</text>
</svg>
