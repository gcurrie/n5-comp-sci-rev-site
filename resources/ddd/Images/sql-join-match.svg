  <text x="40" y="268" font-size="12" font-weight="700" letter-spacing="1.9" fill="#1B6B45" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace">THE JOIN, IN THE WHERE CLAUSE</text>
  <line x1="40" y1="278" x2="301" y2="278" stroke="#C9A227" stroke-width="2"/>
  <rect x="40" y="288" width="560" height="36" fill="#E8F5EE" stroke="#1B6B45" stroke-width="1"/>
  <rect x="40" y="288" width="4" height="36" fill="#1B6B45"/>
  <text xml:space="preserve" x="58" y="312" font-size="13" font-weight="700" fill="#1B6B45" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace">WHERE  Customer.customerNo = Booking.customerNo</text>
  <rect x="40" y="328" width="560" height="36" fill="#EFF6FF" stroke="#1E40AF" stroke-width="1"/>
  <rect x="40" y="328" width="4" height="36" fill="#1E40AF"/>
  <text xml:space="preserve" x="58" y="352" font-size="13" font-weight="700" fill="#1E40AF" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace">  AND  Booking.hotelRef    = Hotel.hotelRef</text>
  <text x="628" y="312" font-size="13" font-style="italic" fill="#4A5568">One condition per join, chained with AND.</text>
  <text x="628" y="334" font-size="13" font-style="italic" fill="#4A5568">Any real search criteria are added the same way.</text>
  <text x="40" y="410" font-size="12" font-weight="700" letter-spacing="1.9" fill="#92750A" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace">WHAT COMES BACK</text>
