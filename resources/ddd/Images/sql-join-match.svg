  <text x="620" y="488" font-size="13.5" fill="#1A1A1A">Each row is stitched together from all <tspan font-weight="700">three</tspan> tables &#8212; only where the keys match.</text>
  <rect x="40" y="570" width="1060" height="62" fill="#00442A"/>
  <text x="570" y="594" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="2" fill="#C9A227" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace">HOW MANY JOINS?</text>
  <text x="570" y="617" text-anchor="middle" font-size="14" fill="#C7DED2"><tspan font-weight="700" fill="#FFFFFF">N</tspan> tables need <tspan font-weight="700" fill="#FFFFFF">N &#8722; 1</tspan> joins. Miss one and every row is paired with every other row.</text>
</svg>
