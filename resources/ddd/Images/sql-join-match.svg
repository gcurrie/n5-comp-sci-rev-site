<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 648" font-family="'Public Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">How a join matches a primary key to a foreign key</title>
  <desc id="dsc">Three tables of sample data sit side by side: Customer, Booking and Hotel. Customer holds customerNo as its primary key, with C201 for Nkosi and C202 for Byrne. Booking holds bookingNo as its primary key plus two foreign keys, customerNo and hotelRef, with booking B1004 for C201 at hotel H10 for 7 nights and booking B1005 for C202 at hotel H11 for 3 nights. Hotel holds hotelRef as its primary key, with H10 Seaview at 55 pounds per person per night and H11 Pinewood at 40 pounds. Matching columns share a colour: customerNo is green in both Customer and Booking, and hotelRef is blue in both Booking and Hotel. Connectors arc over the tables joining each primary key to the foreign key that copies it. Below, the WHERE clause is shown with its two conditions colour-matched to those connectors: Customer.customerNo equals Booking.customerNo, and Booking.hotelRef equals Hotel.hotelRef. Beneath that, the two rows of the result are shown, each stitched together from all three tables: Nkosi, B1004, 7 nights, Seaview, 55 pounds; and Byrne, B1005, 3 nights, Pinewood, 40 pounds. A band along the bottom gives the rule that N tables need N minus 1 joins, so three tables need two, and warns that leaving one out pairs every row with every other row.</desc>

  <text x="40" y="40" font-size="12" font-weight="700" letter-spacing="1.9" fill="#1B6B45" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace">CUSTOMER</text>
