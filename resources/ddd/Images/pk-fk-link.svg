<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="'Public Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">How a primary key becomes a foreign key on the many side</title>
  <desc id="dsc">Two tables stacked so the shared field lines up. The Customer table on top has a CustomerID column marked PK, holding 101 for Ada Khan and 102 for Ben Rae; each value appears exactly once, because the primary key must be unique. The Order table below has the same CustomerID field, this time marked FK, sitting between OrderID and Total. Orders 5001, 5002 and 5003 all carry CustomerID 101, and order 5004 carries 102, so the foreign key repeats freely. A gold connector runs from the CustomerID column of Customer down into the CustomerID column of Order, carrying a 1 at the Customer end and a three-pronged crow's foot marked M at the Order end. Braces to the right of the Order table group Ada Khan's three orders and Ben Rae's one order. Two notes explain that the primary key identifies one customer and never repeats, while the foreign key is a copy of it that may repeat as often as needed. A band along the bottom states the rule: the foreign key always goes in the table on the many side.</desc>

  <text x="200" y="40" text-anchor="start" font-size="12" font-weight="700" letter-spacing="1.9" fill="#1B6B45" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace">CUSTOMER</text>
  <line x1="200" y1="50" x2="272" y2="50" stroke="#C9A227" stroke-width="2"/>
  <rect x="200" y="62" width="170" height="50" fill="#92750A"/>
  <text x="285" y="88" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace">CustomerID</text>
  <text x="285" y="105" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.4" fill="#FEF3C7" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace">PK</text>
  <rect x="370" y="62" width="190" height="50" fill="#001810"/>
