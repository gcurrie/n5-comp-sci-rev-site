<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 136" font-family="'Public Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Entity-relationship diagram showing a one-to-many relationship</title>
  <desc id="dsc">A Customer entity box is joined to a Booking entity box by a line labelled makes. The Customer end carries a 1 marker and the Booking end splits into a three-pronged crow's foot marked M — one customer makes many bookings, but each booking belongs to just one customer.</desc>

  <rect x="60" y="28" width="170" height="76" fill="#FFFFFF" stroke="#00442A" stroke-width="2"/>
  <rect x="60" y="28" width="170" height="5" fill="#C9A227"/>
  <text x="145" y="78" text-anchor="middle" font-size="18" font-weight="700" fill="#00442A">Customer</text>
  <rect x="690" y="28" width="170" height="76" fill="#FFFFFF" stroke="#00442A" stroke-width="2"/>
  <rect x="690" y="28" width="170" height="5" fill="#C9A227"/>
  <text x="775" y="78" text-anchor="middle" font-size="18" font-weight="700" fill="#00442A">Booking</text>
  <line x1="230" y1="66" x2="610" y2="66" stroke="#C9A227" stroke-width="3" stroke-linecap="round"/>
  <line x1="610" y1="66" x2="690" y2="39" stroke="#C9A227" stroke-width="3" stroke-linecap="round"/>
  <line x1="610" y1="66" x2="690" y2="66" stroke="#C9A227" stroke-width="3" stroke-linecap="round"/>
  <line x1="610" y1="66" x2="690" y2="93" stroke="#C9A227" stroke-width="3" stroke-linecap="round"/>
  <text x="420" y="52" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.6" fill="#92750A" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace">MAKES</text>
  <rect x="250" y="80" width="24" height="20" fill="#FFFFFF" stroke="#1B6B45" stroke-width="1"/>
  <text x="262" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#00442A" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace">1</text>
  <rect x="568" y="80" width="24" height="20" fill="#FFFFFF" stroke="#1B6B45" stroke-width="1"/>
  <text x="580" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#00442A" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace">M</text>
</svg>
