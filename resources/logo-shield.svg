<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="shieldTitle">
  <title id="shieldTitle">Computing Revision Hub — binary shield logo</title>

  <!-- backdrop -->
  <rect width="120" height="120" fill="#001810"/>

  <!-- shield -->
  <path d="M26,20 H94 V58 C94,80 78,93 60,102 C42,93 26,80 26,58 Z"
        fill="#00442A" stroke="#C9A227" stroke-width="3" stroke-linejoin="round"/>
  <path d="M33,27 H87 V57 C87,75 74,86 60,94 C46,86 33,75 33,57 Z"
        fill="none" stroke="#1B6B45" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- binary texture -->
  <g font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace"
     font-size="8" font-weight="700" fill="#C7DED2" opacity="0.62" text-anchor="middle" letter-spacing="0.6">
    <text x="60" y="40">01001010</text>
    <text x="60" y="86">110100</text>
  </g>

  <!-- wordmark -->
  <text x="60" y="70" text-anchor="middle" font-size="23" font-weight="700" letter-spacing="0.5" fill="#F8F7F2"
        font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace">CRH</text>

  <!-- pixel cursor -->
  <g transform="translate(74,72)">
    <path d="M0,0 L0,12.5 L3.4,9.4 L5.7,14.2 L8.1,13.0 L5.8,8.4 L9.7,8.4 Z"
          fill="#F8F7F2" stroke="#001810" stroke-width="1.4" stroke-linejoin="round"/>
  </g>
</svg>
